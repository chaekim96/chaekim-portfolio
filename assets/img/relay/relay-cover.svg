<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Relay: from watching to making</title><desc id="desc">An illustrated product preview showing a learning plan, practice checklist, and final project.</desc><rect width="1200" height="750" fill="#e9eddf"/><circle cx="1020" cy="80" r="290" fill="#dbe2cd"/><text x="70" y="99" fill="#252924" font-family="sans-serif" font-size="43" font-weight="700">↗ relay.</text><text x="70" y="183" fill="#66715b" font-family="sans-serif" font-size="14" letter-spacing="3">FROM WATCHING TO MAKING</text><text x="66" y="267" fill="#252924" font-family="sans-serif" font-size="65" font-weight="700" letter-spacing="-3">A playlist.</text><text x="66" y="341" fill="#252924" font-family="sans-serif" font-size="65" font-weight="700" letter-spacing="-3">With a finish line.</text><text x="70" y="397" fill="#66715b" font-family="sans-serif" font-size="20">Watch it. Try it. Make it yours.</text><rect x="70" y="449" width="227" height="50" rx="8" fill="#252924"/><text x="94" y="481" fill="white" font-family="sans-serif" font-size="16">Continue learning →</text><g transform="translate(660 156) rotate(4 215 225)"><rect width="423" height="450" rx="20" fill="#fcfcf7" stroke="#d4dcc9"/><text x="30" y="43" fill="#e65f43" font-family="sans-serif" font-size="11" letter-spacing="2">YOUR NEXT CHAPTER</text><text x="30" y="90" fill="#252924" font-family="sans-serif" font-size="25" font-weight="700">Build a landing page.</text><path d="M30 117H393M30 193H393M30 269H393M30 345H393" stroke="#e2e5dc"/><g fill="#e7eddd"><circle cx="47" cy="155" r="16"/><circle cx="47" cy="231" r="16"/><circle cx="47" cy="307" r="16"/></g><g font-family="sans-serif" font-size="16" fill="#315b48"><text x="40" y="161">✓</text><text x="40" y="237">✓</text><text x="40" y="313">3</text></g><g font-family="sans-serif" fill="#252924" font-size="15"><text x="80" y="153">Sketch the content hierarchy</text><text x="80" y="229">Build your page structure</text><text x="80" y="305">Create a responsive hero</text></g><g font-family="sans-serif" fill="#72766d" font-size="11"><text x="80" y="173">15 min · Practice complete</text><text x="80" y="249">25 min · Practice complete</text><text x="80" y="325">35 min · Up next</text></g><text x="30" y="382" fill="#72766d" font-family="sans-serif" font-size="11">2 of 5 practice tasks complete</text><rect x="30" y="401" width="363" height="6" rx="3" fill="#e2e5dc"/><rect x="30" y="401" width="145" height="6" rx="3" fill="#315b48"/></g><text x="70" y="670" fill="#72766d" font-family="sans-serif" font-size="13" letter-spacing="2">PRODUCT CONCEPT BY CHAE KIM · 2026</text></svg>
