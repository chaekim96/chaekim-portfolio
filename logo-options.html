<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo options — Chae Kim</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#101223; --ink-3:#7b7f92; --accent:#1e5bff; --line:rgba(16,18,35,.1); }
    body { margin:0; font-family: Lato, system-ui, sans-serif; color: var(--ink); background: linear-gradient(#eef4ff, #fff); padding: 40px clamp(16px, 4vw, 48px); }
    h1 { font-family: Poppins, sans-serif; font-weight: 800; letter-spacing: -.03em; font-size: clamp(28px, 4vw, 44px); margin: 0 0 6px; }
    .sub { color: var(--ink-3); margin: 0 0 32px; max-width: 60ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .opt { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .opt h2 { font-family: Poppins, sans-serif; font-size: 15px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
    .opt h2 span { font-family: Poppins; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
    .opt p { margin: 0; font-size: 14px; color: var(--ink-3); line-height: 1.5; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-family: Poppins; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .brand img { height: 32px; width: auto; border-radius: 8px; }
    .links { font-family: Poppins; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); display: flex; gap: 14px; }
    .big { height: 150px; display: grid; place-items: center; border-radius: 12px; background: #f4f7ff; border: 1px dashed var(--line); }
    .big img { height: 96px; width: auto; max-width: 88%; object-fit: contain; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; background: #e6eeff; border: 2px solid var(--accent); overflow: hidden; display: grid; place-items: center; }
    .avatar img { height: 92px; width: 92px; max-width: none; transform: translateY(6px); }
    .nav .avatar { width: 32px; height: 32px; border-width: 1.5px; } .nav .avatar img { width: 30px; height: 30px; transform: translateY(2px); }
    .fav .avatar { width: 16px; height: 16px; border-width: 1px; } .fav .avatar img { width: 15px; height: 15px; transform: translateY(1px); }
    .big.dark { background: #0e1120; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fav { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-3); }
    .fav img { width: 16px; height: 16px; border-radius: 3px; }
    code { font-size: 12px; background: #f4f7ff; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Logo options</h1>
  <p class="sub">Eight directions, each shown in the nav, large on light and dark, and at favicon size. All are real SVGs already in the repo at <code>assets/img/logo-options/</code> — pick a letter and I'll wire it in.</p>
  <div class="grid" id="grid"></div>
  <script>
    const opts = [
      ['A','Monogram tile (current)','A-monogram-tile.svg','Ring C + K strokes with a yellow dot, dark rounded square. Reads as a tech/product mark; scales to favicon well.'],
      ['B','Circle badge','B-circle-badge.svg','Bold CK in a Cal-blue circle. Friendliest and most "app icon"; very legible at small sizes.'],
      ['C','Sticker','C-sticker.svg','Yellow pill with your name, tilted 6°. Matches the highlighter accent and the playful memoji energy.'],
      ['D','Hangul tile','D-hangul-tile.svg','채 (Chae) on a dark tile with a yellow corner dot. Most personal; a quiet nod to 김채운.'],
      ['E','Monoline outline','E-monoline-outline.svg','Outline-only CK with a blue C. Lighter and more editorial (closest to the Supima feel).'],
      ['F','Memoji avatar','memoji','Your memoji cropped into a soft circle. Instantly you; doubles as favicon and social avatar.'],
      ['G','Wordmark','G-wordmark.svg','"chae." in Poppins 800 with a yellow period. No icon at all — cleanest, most confident.'],
      ['H','Pixel CK','H-pixel.svg','5×5 pixel letters. Ties to the pixel-art GIFs and the arcade section.'],
    ];
    const grid = document.getElementById('grid');
    opts.forEach(([k, name, file, desc]) => {
      const src = 'assets/img/logo-options/' + file;
      const dark = { E: 'E-monoline-outline-dark.svg', G: 'G-wordmark-dark.svg' }[k];
      const mark = file === 'memoji' ? '<span class="avatar"><img src="assets/img/memoji.png" alt=""></span>' : `<img src="${src}" alt="">`;
      const markDark = dark ? `<img src="assets/img/logo-options/${dark}" alt="">` : mark;
      const el = document.createElement('div'); el.className = 'opt';
      el.innerHTML = `
        <h2>${name} <span>Option ${k}</span></h2>
        <div class="nav"><span class="brand">${mark} ${k === 'G' || k === 'C' ? '' : 'Chae Kim'}</span><span class="links"><span>Work</span><span>Experience</span><span>About</span></span></div>
        <div class="row"><div class="big">${mark}</div><div class="big dark">${markDark}</div></div>
        <div class="fav">${mark} favicon size · ${file === 'memoji' ? 'memoji.png (CSS circle)' : file}</div>
        <p>${desc}</p>`;
      grid.appendChild(el);
    });
  </script>
</body>
</html>
